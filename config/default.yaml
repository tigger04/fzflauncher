# ABOUTME: Default configuration for fzfLAUNCHER.
# ABOUTME: User overrides go in ~/.config/fzflauncher/config.yaml.

paths:
  applications:
    - /Applications
    - ~/Applications
  use_bundle_name: true

display:
  width: 80
  height: 20
  opacity: 0.95
  position: center
  x_offset: 0
  y_offset: 0

fzf:
  options: "--reverse --border --margin=1,2"

hotkey:
  global: alt+space
